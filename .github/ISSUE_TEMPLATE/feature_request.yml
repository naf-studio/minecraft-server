name: "Feature Request"
description: "Suggest a new plugin, gameplay adjustment, or script enhancement"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Suggest an idea or enhancement for the NAF Minecraft Server.
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What challenge, inconvenience, or missing feature does this address?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the proposed plugin, gameplay mechanic, or automation improvement.
    validations:
      required: true
