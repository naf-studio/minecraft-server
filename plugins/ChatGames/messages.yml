unknown_command: '&d[%prefix%] &cUnknown command.'
config_reloaded: '&d[%prefix%] &fThe configuration files has been reloaded!'
not_enough_permissions: '&d[%prefix%] &cYou don`t have enough permissions to execute this command!'
player_only_command: '&d[%prefix%] &cThis command can only be executed by players!'

cannot_start_from_disabled: '&d[%prefix%] &cYou can`t start a chat game from a disabled world!'
toggle_game: '&d[%prefix%] &fYou have toggled &a%state% &fchat events!'
game_started: '&d[%prefix%] &aYou have started a %game% chat event in your chat!'

#You can use <center> if you wish to do so in the next 4 messages.
top:
  header: '&b&m---------&e&lTOP CHAT&b&m---------'
  format: '&c%spot%. &f%player% &8| &e&l%points% &7points'
  player-stat-format: '&7You`ve got &e&l%player_points% &7wins'
  footer: '&b&m---------------------------'
  
  no_data_message: '&d[%prefix%] &cThere is no data yet! Win a chat game and get points!'

help_command:
  - '&7&m-------------------------------------------------'
  - '&e&l-ChatGames-'
  - '&6'
  - '&6&lCOMMANDS:'
  - '&6'
  - '&a/chatgames (type) &f- &3Starts the event type specified instantly.'
  - '&a/chatgames top &f- &3Shows the top 10 players with most points.'
  - '&a/chatgames toggle &f- &3Toggle games on or off.'
  - '&a/chatgames reload &f- &3Reloads the config.yml file.'
  - '&6'
  - '&2&lGAME TYPES:'
  - '&5unscramble, unreverse, reaction, random,  math, trivia'
  - '&7&m-------------------------------------------------'
  
#Use <center> in LIST messages to center the messages, the lines with this will be centered!

  
#############################
##    CHATGAME MESSAGES    ##
#############################

#YOU CAN USE "%display_name%" AS A REPLACEMENT FOR %player% IN correct_message FOR ALL GAMES.
unscramble:
  gameStartAnnouncement: 
    - '&7*&7&m---------------------------------------------------&7*'
    - '<center>&r✓ ✯ %prefix%&r ✯ ✓'
    - ''
    - '<center>&fYou have &e%timeToGuess% seconds &fto &dunscramble&f: `&b%word%&f`'
    - '&7*&7&m---------------------------------------------------&7*'
  correct_message: 
    - '&d[%prefix%] &a%player% &7has correctly unscrambled `&e%correct_answer%&7` (&c%time%s&7) and got a prize!'
  time_expired_message:
    - '&d[%prefix%] &f%timeToGuess%s &chave passed! &fThe unscramble game is now over! The correct answer was &e%correct_answer%&f!'

