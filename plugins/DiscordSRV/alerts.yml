      - org.bukkit.event.server.ServerCommandEvent
    Channel: "watchdog"
    Conditions:
      - '#sender.hasPermission("cmi.command.maintenance")'
      - "(#command.split(\"\\s+|$\")[0].equals(\"cmi\"))"
      - "(#command.split(\"\\s+|$\")[1].equals(\"maintenance\"))"
    Content: ":tools: **Server is now in maintenance mode**"


