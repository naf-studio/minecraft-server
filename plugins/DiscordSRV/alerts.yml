  # SIGN CHANGES
  - Trigger: "org.bukkit.event.block.SignChangeEvent"
    Channel: "spylog"
    Conditions:
      - "#event.getLine(0).isEmpty() == false || #event.getLine(1).isEmpty() == false || #event.getLine(2).isEmpty() == false || #event.getLine(3).isEmpty() == false"
    Embed:
      Color: "#000000"
      Author:
        ImageUrl: "{embedavatarurl}"
        Name: "SIGN EDITED"
      Description: "`${#event.getPlayer().getName()}` edited a sign\n```/tppos ${#event.getBlock().getLocation().getBlockX()} ${#event.getBlock().getLocation().getBlockY()} ${#event.getBlock().getLocation().getBlockZ()} {world}``````${#event.getLine(0)}\n${#event.getLine(1)}\n${#event.getLine(2)}\n${#event.getLine(3)}```"

  # BOOK AND QUILL SIGNING TO SPYLOG
  - Trigger: "org.bukkit.event.player.PlayerEditBookEvent"
    Channel: "spylog"
    Embed:
      Color: "#000000"
      Author:
        ImageUrl: "{embedavatarurl}"
        Name: 'BOOK ${#event.isSigning() ? "SIGNED" : "EDITED"}'
      Description: |
        `${#event.getPlayer().getName()}` ${#event.isSigning() ? "signed a book" : "edited a book"} with title `${#event.getNewBookMeta().getTitle() ?: "untitled (unsngned)"}`
        ```/tppos ${#player.getLocation().getBlockX()} ${#player.getLocation().getBlockY()} ${#player.getLocation().getBlockZ()} ${#player.getWorld().getName()}``````
        ${T(java.lang.String).join(' ``` ```', #event.getNewBookMeta().getPages())}
        ```

