# ========================================================
# TOTAL REWARDS CONFIGURATION
# This configuration file defines rewards for players
# based on the total number of quests they have completed.
# It includes both global total rewards and category-specific
# total rewards.
# ========================================================
enabled: true # Set to true to enable total rewards functionality

# ========================================================
# GLOBAL TOTAL QUEST REWARDS
# Rewards granted when a player completes a total number
# of quests, regardless of category.
# ========================================================
global_total_rewards:
  10:
    reward_type: COMMAND
    message:
      "&aCongrats %player%! You have completed 10 quests and earned 100 EXP
      and 1 diamond!"
    commands:
      - xp add %player% 100
      - give %player% minecraft:diamond 1
  50:
    reward_type: COMMAND
    message:
      "&aCongrats %player%! You have completed 50 quests and earned 500 EXP
      and 2 diamond!"
    commands:
      - xp add %player% 500
      - give %player% minecraft:diamond 2
